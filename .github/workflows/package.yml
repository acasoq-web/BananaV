# BananaV's packages, made by hand (Actions › Packages › Run workflow, or
# `gh workflow run package.yml --ref <branch>`), kept as the run's
# artifacts — nothing is published:
#
# - Windows x64 and ARM64: BananaV.exe (the C runtime inside; on x64 its
#   32-bit bridge for 32-bit VST plug-ins beside it), a README,
#   the license texts and the third-party notices
#   (tools/third_party_notices.py), in a zip and in an installer
#   (packaging/windows/bananav.iss, Inno Setup), which is tried out here;
# - Linux x64 and ARM64: an AppImage, built on Ubuntu 22.04 for every
#   distribution since (glibc 2.35), with FFmpeg's libraries built here
#   under the LGPL (packaging/linux/build_ffmpeg.sh), the third-party and
#   system libraries' notices, and (from the x64 job) a tarball of the
#   LGPL libraries' sources, FFmpeg's and LAME's;
# - macOS: one app for Apple's chips and Intel Macs (macOS 11 and later),
#   BananaV.app in a disk image (BananaV-...-macos-universal.dmg) with the
#   licenses and notices: each processor's build made natively on its own
#   Mac (Apple's chips: macos-15; Intel: macos-15-intel) with FFmpeg's
#   libraries built here under the LGPL (packaging/macos/build_ffmpeg.sh),
#   then put together and signed by packaging/macos/make_app.py - with a
#   Developer ID and notarized when the repository has the secrets
#   MACOS_CERTIFICATE (a .p12, base64), MACOS_CERTIFICATE_PASSWORD,
#   MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD;
#   ad hoc without them -; the app is started on the runner for a while
#   and its screen kept as a picture; and a tarball of the LGPL libraries'
#   sources, FFmpeg's and LAME's.

name: Packages

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which packages
        type: choice
        options: [all, windows, linux, macos]
        default: all

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    if: inputs.platforms == 'all' || inputs.platforms == 'windows'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The 32-bit bridge (x64 packages): 32-bit Windows.
          targets: ${{ matrix.arch == 'x64' && 'i686-pc-windows-msvc' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: BananaV
        env:
          # No Visual C++ runtime to install.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p bananav
      - name: The 32-bit bridge
        if: matrix.arch == 'x64'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p bananav-bridge32 --target i686-pc-windows-msvc
      - name: Zip
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="BananaV-$version-${GITHUB_SHA::7}-windows-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/bananav.exe "dist/$name/BananaV.exe"
          if [ -f target/i686-pc-windows-msvc/release/bananav-bridge32.exe ]; then
            cp target/i686-pc-windows-msvc/release/bananav-bridge32.exe "dist/$name/bananav-bridge32.exe"
          fi
          cp packaging/windows/README.txt "dist/$name/"
          cp LICENSE "dist/$name/LICENSE.txt"
          cp crates/effects/fonts/OFL.txt "dist/$name/Arimo-OFL.txt"
          cp crates/ocio/licenses/ACES.md "dist/$name/ACES-license.md"
          cp crates/effects/licenses/gl-transitions.md "dist/$name/GL-Transitions-license.md"
          cp crates/effects/licenses/lensfun.md "dist/$name/Lensfun-database-license.md"
          cp crates/vst3-sys/licenses/vst3-pluginterfaces.txt "dist/$name/VST3-SDK-interfaces-license.txt"
          python tools/third_party_notices.py "$(rustc -vV | sed -n 's/^host: //p')" > "dist/$name/THIRD-PARTY-NOTICES.txt"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) {
            Invoke-WebRequest -OutFile innosetup.exe https://jrsoftware.org/download.php/is.exe
            Start-Process -Wait innosetup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          }
          & $iscc /Qp "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" "/DFiles=$PWD\dist\$env:NAME" "/O$PWD\dist-setup" "/F$env:NAME-setup" packaging\windows\bananav.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: The installer, tried out
        # Installs without a question, starts BananaV for a while, opens
        # nothing else, and takes it all away again.
        shell: pwsh
        run: |
          $setup = Start-Process -Wait -PassThru "dist-setup\$env:NAME-setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon,projects'
          if ($setup.ExitCode) { throw "the installer stopped with $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\BananaV"
          foreach ($file in "$app\BananaV.exe", "$app\bananav.ico", "$app\LICENSE.txt", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\BananaV.lnk", "$env:USERPROFILE\Desktop\BananaV.lnk") {
            if (-not (Test-Path $file)) { throw "no $file" }
          }
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\BananaV.Project\shell\open\command').'(default)'
          if ($command -notlike '*BananaV.exe*') { throw "project files open with $command" }
          $running = Start-Process -PassThru "$app\BananaV.exe"
          Start-Sleep 20
          if ($running.HasExited) { Write-Warning "BananaV stopped with exit code $($running.ExitCode)" } else { $running | Stop-Process -Force; "BananaV was still running after 20 s" }
          Start-Process -Wait "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          foreach ($i in 1..30) { if (-not (Test-Path "$app\BananaV.exe")) { break }; Start-Sleep 1 }
          if (Test-Path "$app\BananaV.exe") { throw "the uninstaller left BananaV.exe" }
          if (Test-Path 'HKCU:\Software\Classes\BananaV.Project') { throw "the uninstaller left the project files' association" }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-setup
          path: dist-setup/${{ env.NAME }}-setup.exe
          retention-days: 30

  linux:
    name: Linux ${{ matrix.arch }}
    if: inputs.platforms == 'all' || inputs.platforms == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            tool: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            tool: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm pkg-config git file libclang-dev libasound2-dev \
            libva-dev libdrm-dev zlib1g-dev libbz2-dev liblzma-dev \
            libdav1d-dev libvpx-dev libaom-dev libopus-dev libmp3lame-dev \
            libxkbcommon0 libxkbcommon-x11-0
          # Not in every release: FFmpeg goes without the missing ones.
          for p in libsvtav1enc-dev libopenh264-dev libkvazaar-dev; do
            sudo apt-get install -y --no-install-recommends "$p" || echo "no $p"
          done
      - name: FFmpeg (kept)
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-lgpl
          key: ffmpeg-${{ matrix.arch }}-${{ hashFiles('packaging/linux/build_ffmpeg.sh') }}
      - name: FFmpeg (built)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh packaging/linux/build_ffmpeg.sh "$PWD/ffmpeg-lgpl"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: BananaV
        run: |
          export PKG_CONFIG_PATH="$PWD/ffmpeg-lgpl/lib/pkgconfig"
          cargo build --release -p bananav
      - name: AppImage
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="BananaV-$version-${GITHUB_SHA::7}-linux-${{ matrix.arch }}"
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.tool }}.AppImage"
          chmod +x linuxdeploy-*.AppImage
          export LD_LIBRARY_PATH="$PWD/ffmpeg-lgpl/lib"
          # The window library loads xkbcommon at run time (not linked, so
          # not found by linuxdeploy): inside, for systems without it.
          lib="/usr/lib/$(gcc -dumpmachine)"
          ./linuxdeploy-${{ matrix.tool }}.AppImage --appimage-extract-and-run \
            --appdir AppDir -e target/release/bananav \
            -l "$lib/libxkbcommon.so.0" -l "$lib/libxkbcommon-x11.so.0" \
            -d packaging/linux/bananav.desktop -i packaging/icons/bananav.png --output appimage
          mkdir -p "dist/$name"
          mv BananaV*.AppImage "dist/$name/$name.AppImage"
          cp packaging/linux/README.txt "dist/$name/"
          cp LICENSE "dist/$name/LICENSE.txt"
          cp ffmpeg-lgpl/share/licenses/ffmpeg/COPYING.LGPLv2.1 "dist/$name/FFmpeg-LGPL-2.1.txt"
          cp ffmpeg-lgpl/share/licenses/ffmpeg/LICENSE.md "dist/$name/FFmpeg-license.md"
          cp crates/effects/fonts/OFL.txt "dist/$name/Arimo-OFL.txt"
          cp crates/ocio/licenses/ACES.md "dist/$name/ACES-license.md"
          cp crates/effects/licenses/gl-transitions.md "dist/$name/GL-Transitions-license.md"
          cp crates/effects/licenses/lensfun.md "dist/$name/Lensfun-database-license.md"
          cp crates/vst3-sys/licenses/vst3-pluginterfaces.txt "dist/$name/VST3-SDK-interfaces-license.txt"
          python3 tools/third_party_notices.py "$(rustc -vV | sed -n 's/^host: //p')" > "dist/$name/THIRD-PARTY-NOTICES.txt"
          # The system libraries the AppImage carries: each one's Debian
          # copyright file (their licenses and notices).
          notices="dist/$name/SYSTEM-LIBRARIES-NOTICES.txt"
          printf 'BananaV - the system libraries inside the AppImage\n\nEach library, the Ubuntu 22.04 package it comes from and that package'"'"'s\ncopyright file (its licenses). FFmpeg'"'"'s libraries are BananaV'"'"'s own build\n(FFmpeg-LGPL-2.1.txt, FFmpeg-license.md).\n\n' > "$notices"
          for f in AppDir/usr/lib/*.so*; do
            lib=$(basename "$f")
            pkg=$(dpkg -S "$lib" 2>/dev/null | head -1 | cut -d: -f1) || true
            if [ -z "$pkg" ]; then
              printf -- '%s: not from an Ubuntu package (FFmpeg'"'"'s, see above)\n\n' "$lib" >> "$notices"
              continue
            fi
            printf -- '------------------------------------------------------------------------------\n%s (Ubuntu package %s)\n\n' "$lib" "$pkg" >> "$notices"
            cat "/usr/share/doc/$pkg/copyright" >> "$notices" 2>/dev/null || echo "(no copyright file)" >> "$notices"
            printf '\n' >> "$notices"
          done
          ldd target/release/bananav
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: LGPL sources
        # FFmpeg's and LAME's sources go with the packages (the LGPL asks
        # for them): FFmpeg's tag build_ffmpeg.sh builds, the script, and
        # Ubuntu's source package of the LAME the AppImage carries.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          src="BananaV-$version-${GITHUB_SHA::7}-LGPL-sources"
          ffmpeg=$(sed -n 's/^ffmpeg_version=${FFMPEG_VERSION:-\(.*\)}$/\1/p' packaging/linux/build_ffmpeg.sh)
          mkdir -p "$src/lame"
          curl -fsSL -o "$src/FFmpeg-n$ffmpeg.tar.gz" "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n$ffmpeg.tar.gz"
          cp packaging/linux/build_ffmpeg.sh "$src/"
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
          sudo apt-get update -qq
          (cd "$src/lame" && apt-get source --download-only lame)
          printf 'The sources of the LGPL libraries in BananaV %s'"'"'s Linux packages:\n- FFmpeg n%s (FFmpeg-n%s.tar.gz), built by build_ffmpeg.sh;\n- LAME, Ubuntu 22.04'"'"'s source package (lame/).\n' "$version" "$ffmpeg" "$ffmpeg" > "$src/README.txt"
          mkdir -p dist-src
          tar -czf "dist-src/$src.tar.gz" "$src"
          echo "SRC=$src" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: ${{ env.SRC }}
          path: dist-src/${{ env.SRC }}.tar.gz
          retention-days: 30
      - name: A start, on a virtual screen
        # Opens and runs for a while without a crash (it has no card: the
        # software Vulkan).
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers
          set +e
          timeout 20 xvfb-run -a "dist/$NAME/$NAME.AppImage" --appimage-extract-and-run
          code=$?
          if [ "$code" = 124 ]; then
            echo "BananaV was still running after 20 s"
          else
            echo "::warning::BananaV stopped with exit code $code on the virtual screen"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}
          retention-days: 30

  macos-build:
    name: macOS ${{ matrix.arch }} (build)
    if: inputs.platforms == 'all' || inputs.platforms == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: brew install nasm meson ninja cmake pkgconf
      - name: FFmpeg (kept)
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-lgpl
          key: ffmpeg-macos-${{ matrix.arch }}-${{ hashFiles('packaging/macos/build_ffmpeg.sh') }}
      - name: FFmpeg (built)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh packaging/macos/build_ffmpeg.sh "$PWD/ffmpeg-lgpl"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-macos
      - name: BananaV
        env:
          # Room in the program's header for its libraries' names inside
          # the app, and where they are (BananaV.app/Contents/Frameworks).
          RUSTFLAGS: -C link-arg=-Wl,-headerpad_max_install_names -C link-arg=-Wl,-rpath,@executable_path/../Frameworks
          # Two at a time: the interface's crate is big for the runner's
          # memory.
          CARGO_BUILD_JOBS: "2"
        run: |
          export PKG_CONFIG_PATH="$PWD/ffmpeg-lgpl/lib/pkgconfig"
          cargo build --release -p bananav
          otool -L target/release/bananav
      - name: Kept for the app
        run: |
          mkdir -p "kept/${{ matrix.arch }}"
          cp target/release/bananav "kept/${{ matrix.arch }}/bananav"
          cp -R ffmpeg-lgpl "kept/${{ matrix.arch }}/ffmpeg-lgpl"
          tar -czf "bananav-macos-${{ matrix.arch }}.tar.gz" -C kept "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bananav-macos-${{ matrix.arch }}
          path: bananav-macos-${{ matrix.arch }}.tar.gz
          retention-days: 7

  macos:
    name: macOS universal
    needs: macos-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: bananav-macos-*
          path: builds
          merge-multiple: true
      - name: The signing keychain
        # Only with the Developer ID's secrets: a keychain of its own for
        # the run, with the certificate.
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: The app and its disk image
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for a in arm64 x86_64; do tar -xzf "builds/bananav-macos-$a.tar.gz" -C builds; done
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="BananaV-$version-${GITHUB_SHA::7}-macos-universal"
          docs="$RUNNER_TEMP/docs"
          lic=builds/arm64/ffmpeg-lgpl/share/licenses
          mkdir -p "$docs"
          cp LICENSE "$docs/LICENSE.txt"
          cp "$lic/ffmpeg/COPYING.LGPLv2.1" "$docs/FFmpeg-LGPL-2.1.txt"
          cp "$lic/ffmpeg/LICENSE.md" "$docs/FFmpeg-license.md"
          cp "$lic/dav1d/COPYING" "$docs/dav1d-license.txt"
          cp "$lic/lame/COPYING" "$docs/LAME-LGPL.txt"
          cp "$lic/svt-av1/LICENSE.md" "$docs/SVT-AV1-license.md"
          cp "$lic/svt-av1/PATENTS.md" "$docs/SVT-AV1-patents.md"
          cp crates/effects/fonts/OFL.txt "$docs/Arimo-OFL.txt"
          cp crates/ocio/licenses/ACES.md "$docs/ACES-license.md"
          cp crates/effects/licenses/gl-transitions.md "$docs/GL-Transitions-license.md"
          cp crates/effects/licenses/lensfun.md "$docs/Lensfun-database-license.md"
          cp crates/vst3-sys/licenses/vst3-pluginterfaces.txt "$docs/VST3-SDK-interfaces-license.txt"
          python3 tools/third_party_notices.py aarch64-apple-darwin > "$docs/THIRD-PARTY-NOTICES.txt"
          python3 packaging/macos/make_app.py --version "$version" \
            --arch arm64 builds/arm64/bananav builds/arm64/ffmpeg-lgpl \
            --arch x86_64 builds/x86_64/bananav builds/x86_64/ffmpeg-lgpl \
            --out dist --dmg "$name.dmg" --docs "$docs"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: A start
        # The app from its disk image, as a user opens it: it runs for a
        # while without a crash; its screen is kept as a picture.
        run: |
          mount=$(hdiutil attach "dist/$NAME.dmg" -nobrowse -readonly | tail -1 | cut -f3-)
          cp -R "$mount/BananaV.app" "$RUNNER_TEMP/"
          hdiutil detach "$mount"
          "$RUNNER_TEMP/BananaV.app/Contents/MacOS/BananaV" > bananav-start.log 2>&1 &
          pid=$!
          sleep 30
          screencapture -x bananav-macos-start.png || echo "::warning::no picture of the screen"
          if kill -0 "$pid" 2>/dev/null; then
            echo "BananaV was still running after 30 s"
            kill "$pid"
          else
            code=0
            wait "$pid" || code=$?
            cat bananav-start.log
            echo "::error::BananaV stopped (exit code $code)"
            exit 1
          fi
          cat bananav-start.log
      - name: LGPL sources
        # FFmpeg's and LAME's sources go with the package (the LGPL asks
        # for them): the tag and tarball build_ffmpeg.sh builds, and the
        # script.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          src="BananaV-$version-${GITHUB_SHA::7}-macOS-LGPL-sources"
          ffmpeg=$(sed -n 's/^ffmpeg_version=${FFMPEG_VERSION:-\(.*\)}$/\1/p' packaging/macos/build_ffmpeg.sh)
          lame=$(sed -n 's/^lame_version=${LAME_VERSION:-\(.*\)}$/\1/p' packaging/macos/build_ffmpeg.sh)
          mkdir -p "$src"
          curl -fsSL --retry 5 -o "$src/FFmpeg-n$ffmpeg.tar.gz" "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n$ffmpeg.tar.gz"
          curl -fsSL --retry 5 -o "$src/lame-$lame.tar.gz" "https://downloads.sourceforge.net/project/lame/lame/$lame/lame-$lame.tar.gz"
          cp packaging/macos/build_ffmpeg.sh "$src/"
          {
            echo "The sources of the LGPL libraries in BananaV $version's macOS package:"
            echo "- FFmpeg n$ffmpeg (FFmpeg-n$ffmpeg.tar.gz), built by build_ffmpeg.sh;"
            echo "- LAME $lame (lame-$lame.tar.gz), built by the same script."
          } > "$src/README.txt"
          mkdir -p dist-src
          tar -czf "dist-src/$src.tar.gz" "$src"
          echo "SRC=$src" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.dmg
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SRC }}
          path: dist-src/${{ env.SRC }}.tar.gz
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-start
          path: |
            bananav-macos-start.png
            bananav-start.log
          retention-days: 7
          if-no-files-found: ignore

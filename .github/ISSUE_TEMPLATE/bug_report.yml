name: Bug report
description: Something in BananaV does not work as it should (a crash, lost work, a wrong picture or sound…).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please search the [existing issues](https://github.com/acasoq-web/BananaV/issues) first.

        - **Security problems** are reported privately, never here: see [SECURITY.md](https://github.com/acasoq-web/BananaV/blob/main/SECURITY.md).
        - **Questions and help** are on [Discord](https://discord.gg/vtC7Yasz98).
  - type: input
    id: version
    attributes:
      label: BananaV version
      description: The package's name, or the commit you built from.
      placeholder: BananaV-0.2.0-windows-x64
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Processor
      options:
        - x64 (Intel, AMD)
        - ARM64
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: System details
      description: The system's version; on Linux, the distribution and X11 or Wayland.
      placeholder: Ubuntu 24.04, Wayland
  - type: input
    id: graphics
    attributes:
      label: Graphics card and driver
      placeholder: NVIDIA GeForce RTX 3060, driver 560.94
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Crash or freeze
        - Lost or damaged project
        - Wrong picture or sound
        - Importing or rendering media
        - Editing or the timeline
        - Effects, transitions or plug-ins
        - The interface or a translation
        - Speed
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw. A crash or a lost project is the most serious kind of bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a new project, if you can.
      placeholder: |
        1. Import a 1080p MP4 file
        2. Add it to the timeline
        3. Split the event at 00:00:05;00
        4. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Messages or logs
      description: Error messages, and the logs Options › Preferences › File I/O can write (plug-in loading, reads, renders).
      render: text
  - type: textarea
    id: files
    attributes:
      label: Files
      description: |
        Attach a small project and media that show the problem, if you can.
        Share only media you made or that is openly licensed, and only screenshots of BananaV.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this bug is not there yet.
          required: true
        - label: I use the latest release, or a build of `main`.
        - label: I follow the [Code of Conduct](https://github.com/acasoq-web/BananaV/blob/main/CODE_OF_CONDUCT.md).
          required: true
